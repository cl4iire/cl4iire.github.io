name: Publication du site
# Runs on every push to main (yours or Claire's via Pages CMS):
# 1. tidies new photos into their folder, converts them to WebP and commits them ("[bot] ..."),
# 2. checks the content (an error stops here: the online site stays on the previous version),
# 3. builds and publishes the site on GitHub Pages.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write # to commit the optimized images
  pages: write
  id-token: write

# One publication at a time, in order (no cancellation: every save is published)
concurrency:
  group: publication
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      superseded: ${{ steps.save.outputs.superseded }}
    steps:
      # Always the latest version of main (not the commit that triggered the run): when Claire saves
      # twice in a row, the second publication starts from the robot's work of the first one (no conflict)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Ranger et optimiser les nouvelles images (WebP, 2560 px max)
        run: npm run optimize-images

      - name: Générer l'icône du site et l'image de partage
        run: npm run icons

      - name: Enregistrer les images optimisées
        id: save
        run: |
          superseded() {
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "## ⏭️ Publication remplacée par une plus récente" >> "$GITHUB_STEP_SUMMARY"
            echo "Une modification plus récente a été enregistrée pendant cette publication : c'est sa publication qui vérifiera le contenu et mettra le site à jour." >> "$GITHUB_STEP_SUMMARY"
            echo "Modification plus récente détectée : la publication suivante prend le relais."
          }
          # Commits saved on main since this publication started (e.g. Claire adds the photo to an album
          # a few seconds after uploading it): this publication's checks would not see their repair
          git fetch -q origin main
          newer=$(git rev-list --count HEAD..origin/main)

          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A public content
            git commit -m "[bot] Rangement et optimisation des images, icônes"
            if ! git rebase origin/main || ! git push origin HEAD:main; then
              git rebase --abort 2>/dev/null || true
              superseded
              exit 0
            fi
          else
            echo "Aucune image à ranger ni à optimiser."
          fi

          # The robot's work is saved; the newer commits have their own publication (queued after this one),
          # which starts from the latest version, repairs it if needed, checks it and publishes it
          if [ "$newer" -gt 0 ]; then
            superseded
          fi

      - name: Vérifier le contenu
        if: steps.save.outputs.superseded != 'true'
        run: npm run check

      - if: steps.save.outputs.superseded != 'true'
        run: npm run build
      - if: steps.save.outputs.superseded != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.superseded != 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
