<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Old address of the site (repository "portfolioClaire", before it was renamed cl4iire.github.io).
      GitHub Pages cannot send a server redirect: an immediate meta refresh is treated by Google
      as a permanent redirect, and the canonical link points to the new address.
      Keep this file as long as the old address may still be found (Google, old links on CVs, LinkedIn...).
    -->
    <meta http-equiv="refresh" content="0; url=https://cl4iire.github.io/" />
    <link rel="canonical" href="https://cl4iire.github.io/" />
    <title>Claire Buhaceanu Laborde - Portfolio</title>
    <script>
      location.replace('https://cl4iire.github.io/' + location.hash);
    </script>
  </head>
  <body>
    <p>Le portfolio a déménagé : <a href="https://cl4iire.github.io/">https://cl4iire.github.io/</a></p>
  </body>
</html>
